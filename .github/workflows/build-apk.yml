name: Build HongDangMu Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "security/**"
    paths:
      - "android/**"
      - "tools/audit_android_apk.py"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
          gradle --version
      - name: Lint and build safer APK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          gradle -p android :app:lintDebug :app:assembleDebug --no-daemon
      - name: Audit built APK permissions and bytecode
        shell: bash
        run: |
          python tools/audit_android_apk.py android/app/build/outputs/apk/debug/app-debug.apk "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Generate checksum
        shell: bash
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hongdangmu-mobile-safe-debug-v28.7.0
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
